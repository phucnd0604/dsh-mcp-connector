# MCP Connector plugin (DSH Bundle patch)
# Inserted automatically when this bundle is merged into a profile.
# The plugin owns the connector catalog, three connection channels, credential storage, and mcp-client entry provisioning.
- insert:
    - id: mcp-connector
      name: 'dsh-mcp-connector'
      config:
        catalogUrl: 'https://cdn.jsdelivr.net/gh/duhu2000/dsh-mcp-connector-registry@main/catalog.json'
        persistSecrets: true
        entryPrefix: 'mcp'
        refreshSkewMs: 300000
        openBrowser: true
        showSidebarEntry: true