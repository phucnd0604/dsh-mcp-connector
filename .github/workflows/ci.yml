name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # DSH dependencies are provided by the Host; --legacy-peer-deps stops npm from trying to assemble an incomplete Host of its own.
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run check

  windows:
    name: windows (24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The target problem comes from Windows Desktop; running the same full gate as Linux prevents platform regressions.
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Windows CLI native process regression
        run: node --test --test-reporter=tap test/cli-providers.test.mjs
      - run: npm run check

  zod-compat:
    name: zod compatibility (4.1.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm install zod@4.1.8 --no-save --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test

  pr-package:
    name: PR test package
    if: github.event_name == 'pull_request'
    needs: [test, windows, zod-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp an installable prerelease version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const [major, minor, patch] = p.version.split("-")[0].split(".").map(Number);
          p.version = [major, minor, patch + 1].join(".") + "-pr." + process.env.PR_NUMBER + "." + process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
      - run: npm pack --ignore-scripts
      - run: shasum -a 256 dsh-mcp-connector-*.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-mcp-connector-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            dsh-mcp-connector-*.tgz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
