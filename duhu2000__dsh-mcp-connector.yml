url: https://github.com/phucnd0604/dsh-mcp-connector
name: phucnd0604/dsh-mcp-connector
category: tools
description:
  en: 'MCP Connector for DeepSeek Harness: an MCP manager with one panel to connect MCP Servers, configure authorization, search tools across connections, and troubleshoot failures. Browse a continuously updated catalog of over one hundred connectors; filter by connection/server/status, inspect readable parameters and the last successful cache time, and rediscover tools. Supports OAuth 2.0 PKCE, API keys, stdio/HTTP, and mcpServers JSON import. English translation fork of duhu2000/dsh-mcp-connector.'