        const credentialAuth = ['bearer', 'api-key'].includes(d.authMode);
        const action = credentialAuth ? `window.__mcp.openConfig('${id}')` : `window.__mcp.showDetail('${id}')`;
        return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn status-warning" type="button" onclick="event.stopPropagation();${action}">${credentialAuth ? t('reconfigureCredential') : t('reauthorize')}</button>`;
      }
      if (state === 'recovering') return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn status-warning" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('recovering')}</button>`;
      if (state === 'degraded') return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn status-warning" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('partialError')}</button>`;
      if (state === 'unavailable') return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn status-bad" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('connectionError')}</button>`;
    }
    if (d.authMode === 'oauth2-pkce') {
      return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn" type="button" onclick="event.stopPropagation();window.__mcp.connect('${id}')">${t('connect')}</button>`;
    }
    if (d.authMode === 'none') {
      return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn" type="button" onclick="event.stopPropagation();window.__mcp.connect('${id}')">${t('connect')}</button>`;
    }
    return `<button class="btn ghost" type="button" onclick="event.stopPropagation();window.__mcp.showDetail('${id}')">${t('details')}</button><button class="btn" type="button" onclick="event.stopPropagation();window.__mcp.openConfig('${id}')">${t('configure')}</button>`;
  }

  const EXPLORER_STATUS = { pending: 'Not discovered yet', unknown: 'Host status unknown', success: 'Last discovery succeeded', failed: 'Last discovery failed' };
  const formatObserved = (value) => value ? new Date(value).toLocaleString('en-US', { hour12: false }) : 'No record yet';

  async function loadToolExplorer() {
    const sequence = ++explorerSequence;
    const workspaceId = currentWorkspace?.workspaceId;
    syncMarketNav();
    if (!$('#tool-explorer')) {
      main.innerHTML = `<section id="tool-explorer"><p class="hint">Search the tool cache of enabled connections in the current scope; tools are not executed. A successful recent discovery does not mean every call will succeed.</p><div class="explorer-filters"><label>Connection<select id="explorer-connection" aria-label="Filter by connection"></select></label><label>Server<select id="explorer-server" aria-label="Filter by server"></select></label><label>Discovery status<select id="explorer-status" aria-label="Filter by discovery status"><option value="">All statuses</option>${Object.entries(EXPLORER_STATUS).map(([key, label]) => `<option value="${key}">${label}</option>`).join('')}</select></label><button class="btn ghost" data-explorer-clear>Clear filters</button></div><p id="explorer-summary" role="status">Reading cache…</p><div id="explorer-connections"></div><div id="explorer-results"></div><div id="explorer-pages" class="m-actions"></div></section>`;
    }
    const response = await call('toolExplorer', { ...workspaceParams(), ...explorerFilter, query: searchQuery, offset: explorerOffset, limit: 20 });
    if (sequence !== explorerSequence || view !== 'tools' || workspaceId !== currentWorkspace?.workspaceId) return;
    if (!response.ok) { $('#explorer-summary').textContent = response.message; return; }
    explorerData = response.detail;
    const { connections = [], selectedConnections = [], items = [], total = 0 } = explorerData;
    if (explorerOffset >= total && explorerOffset > 0) { explorerOffset = Math.max(0, Math.floor((total - 1) / 20) * 20); return loadToolExplorer(); }
    $('#explorer-connection').innerHTML = '<option value="">All connections</option>' + connections.map((c) => `<option value="${esc(c.connectionKey)}">${esc(c.connectionName)} · ${esc(c.serverName)}</option>`).join('');
    const services = [...new Set(connections.filter((c) => !explorerFilter.connectionKey || c.connectionKey === explorerFilter.connectionKey).map((c) => c.serverName))];
    $('#explorer-server').innerHTML = '<option value="">All servers</option>' + services.map((name) => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
    $('#explorer-connection').value = explorerFilter.connectionKey;
    $('#explorer-server').value = explorerFilter.serverName;
    $('#explorer-status').value = explorerFilter.status;
    $('#explorer-summary').textContent = `${explorerData.scopeLabel} · ${connections.length} connections · ${total} tools match · showing ${items.length}`;
    $('#explorer-connections').innerHTML = `<details ${explorerFilter.connectionKey || !total ? 'open' : ''}><summary>Connection status and troubleshooting (${selectedConnections.length})</summary>${selectedConnections.map((c) => `<div class="explorer-card"><strong>${esc(c.connectionName)}</strong><div>${esc(c.serverName)} · ${esc(EXPLORER_STATUS[c.status] || c.status)} · cache holds ${c.toolCount} tools</div><div class="hint">Last discovery: ${esc(formatObserved(c.checkedAt))}; last success: ${esc(formatObserved(c.observedAt))}${c.stale ? ' · Cache older than 24 hours' : ''}${c.cacheTruncated ? ' · Cached list truncated' : ''}</div>${c.diagnostic ? `<div>${esc(c.diagnostic.stageLabel)}: ${esc(c.diagnostic.message)}<br>Suggestion: ${esc(c.diagnostic.action)}</div>` : ''}${c.retryReason === 'auth' ? '<p>Background retry paused after an auth failure; update credentials or reauthorize on the Installed page.</p>' : c.nextDiscoveryAt ? `<p class="hint">Next background discovery no earlier than: ${esc(formatObserved(c.nextDiscoveryAt))} (while the page stays open)</p>` : ''}<div class="m-actions"><button class="btn ghost" data-explorer-action="discover" data-key="${esc(c.connectionKey)}" ${explorerBusy.has(c.connectionKey) ? 'disabled' : ''}>Rediscover tools</button><button class="btn ghost" data-explorer-action="check" data-key="${esc(c.connectionKey)}" ${explorerBusy.has(c.connectionKey) ? 'disabled' : ''}>Check connection</button></div></div>`).join('') || '<p>No connections under the current filters.</p>'}</details>`;
    $('#explorer-results').innerHTML = items.map((item, index) => `<article class="explorer-card"><strong>${esc(item.name)}</strong>${item.title !== item.name ? `<div>${esc(item.title)}</div>` : ''}<p>${esc(item.description || 'No description')}</p><div class="hint">Source: ${esc(item.connection.connectorName)} / ${esc(item.connection.connectionName)} / ${esc(item.serverName)}<br>${esc(EXPLORER_STATUS[item.connection.status])} · Last successful cache ${esc(formatObserved(item.observedAt))}${item.stale ? ' · Cache older than 24 hours' : ''}</div><button class="btn ghost" data-explorer-detail="${index}">Parameter details</button></article>`).join('') || `<p class="empty">${connections.length ? 'No tools match. Adjust the keyword or filters; you can also expand the connection status to check whether tools are not discovered yet or reads are failing.' : 'No enabled connections in the current scope. Add a connection first, or pick another workspace.'}</p>`;
    $('#explorer-pages').innerHTML = `<button class="btn ghost" data-explorer-page="prev" ${explorerOffset === 0 ? 'disabled' : ''}>Previous</button><span>${Math.floor(explorerOffset / 20) + 1} / ${Math.max(1, Math.ceil(total / 20))}</span><button class="btn ghost" data-explorer-page="next" ${explorerOffset + 20 >= total ? 'disabled' : ''}>Next</button>`;
  }

  main.addEventListener('change', (event) => {
    const fields = { 'explorer-connection': 'connectionKey', 'explorer-server': 'serverName', 'explorer-status': 'status' };
    const field = fields[event.target.id];
    if (!field) return;
    explorerFilter[field] = event.target.value;
    if (field === 'connectionKey') explorerFilter.serverName = '';
    explorerOffset = 0; void loadToolExplorer();
  });

  main.addEventListener('click', async (event) => {
    const button = event.target.closest('button');
    if (!button || view !== 'tools') return;
    if (button.hasAttribute('data-explorer-clear')) {
      explorerFilter = { connectionKey: '', serverName: '', status: '' }; explorerOffset = 0; await loadToolExplorer();
    } else if (button.dataset.explorerPage) {
      explorerOffset = Math.max(0, explorerOffset + (button.dataset.explorerPage === 'next' ? 20 : -20)); await loadToolExplorer();
    } else if (button.dataset.explorerDetail !== undefined) {
      const item = explorerData?.items[Number(button.dataset.explorerDetail)];
      if (!item) return;
      const requestId = ++explorerDetailSequence;
      const result = await call('toolExplorerDetail', { connectionKey: item.connectionKey, serverName: item.serverName, toolName: item.name, ...workspaceParams() });
      if (requestId !== explorerDetailSequence || view !== 'tools') return;
      if (result.ok) showToolParameters(result.detail.tool, item.name, item.serverName);
      else showToast(result.message, false);
    } else if (button.dataset.explorerAction) {
      const key = button.dataset.key;
      if (explorerBusy.has(key)) return;
      explorerBusy.add(key); button.disabled = true;
      const result = await call('toolExplorerAction', { connectionKey: key, action: button.dataset.explorerAction, ...workspaceParams() });
      explorerBusy.delete(key); showToast(result.message, result.ok);
      if (view === 'tools') await loadToolExplorer();
    }
  });

  async function loadInstalled() {
    syncMarketNav();
    main.innerHTML = '<div class="empty">Loading…</div>';
    const [r, migration] = await Promise.all([call('status', workspaceParams()), call('migrationPreview', { scanStored: false })]);
    if (!r.ok) { main.innerHTML = `<div class="empty">${esc(r.message)}</div>`; return; }
    updateAvailableWorkspaces(r.detail?.scope?.workspaces);
    const items = r.detail?.items ?? [];
    installedItems = items;
    scopeRevision = Number.isInteger(r.detail?.scope?.revision) ? r.detail.scope.revision : 0;
    scopeRollbackRevision = r.detail?.scope?.history?.at(-1)?.revision ?? null;
    setTabCount('installed', items.length);
    const pendingMigration = migration.ok ? migration.detail?.pendingCount || 0 : 0;
    const migrationHtml = pendingMigration > 0 ? `<div class="migration-banner"><div class="copy"><strong>Legacy QCC MCP authorization found</strong>You can safely copy ${pendingMigration} authorization set(s) to MCP Connector; the old plugin and its credentials are not deleted.</div><button class="btn" type="button" onclick="window.__mcp.migrateLegacy()">Migrate</button></div>` : '';
    if (!items.length) { main.innerHTML = `${migrationHtml}<div class="stats"><span class="count">Existing authorizations can be copied from the legacy QCC OAuth plugin</span><button class="btn ghost" id="config-backup" type="button" onclick="window.__mcp.openConfigBackup()">Config backup</button><button class="btn ghost" type="button" onclick="window.__mcp.scanLegacy()">Scan legacy plugin</button></div><div class="empty">No MCP connections yet · connect one from the Market</div>`; return; }
    markCommunityCtaEligible();
    const filtered = items.filter(matchesSearch);
    const rollbackDisabled = scopeRollbackRevision === null ? 'disabled' : '';
    main.innerHTML = `${migrationHtml}<div class="stats"><span class="count"><strong>${filtered.length}</strong> connections in total${searchQuery ? ` · search "${esc(searchQuery)}"` : ''} · scope revision=${scopeRevision}</span><button class="btn ghost" id="scope-rollback" type="button" ${rollbackDisabled} onclick="window.__mcp.rollbackScope()">Undo last scope change</button><button class="btn ghost" id="config-backup" type="button" onclick="window.__mcp.openConfigBackup()">Config backup</button><button class="btn ghost" type="button" onclick="window.__mcp.scanLegacy()">Scan legacy plugin</button></div><div class="rows">${filtered.map(rowHtml).join('')}</div>${communityCtaHtml()}`;
  }

  function rowHtml(r) {
    const key = esc(r.key);
    const canRename = r.canRename === true;
    const canEditConfiguration = r.canEditConfiguration === true;
    const authMode = r.authMode === 'oauth' ? '<span class="badge auth-oauth">OAuth</span>' : `<span class="badge">${esc(r.authMode || 'manual')}</span>`;
    const healthLabels = { healthy: 'Connected', unknown: 'Status unknown', configured: 'Configured', reauth: 'Reauthorization required', recovering: 'Auto-retrying', degraded: 'Partially degraded', unavailable: 'Connection error', disabled: 'Disabled' };
    const healthClass = r.connectionState === 'healthy' ? 'pass' : ['reauth', 'recovering', 'degraded'].includes(r.connectionState) ? 'partial' : r.connectionState === 'unavailable' ? 'fail' : '';
    const healthBadge = `<span class="badge ${healthClass}">${esc(healthLabels[r.connectionState] || 'Status unknown')}</span>`;
    const scopeBadge = `<span class="badge">${esc(r.scope?.label || 'Global')}</span>`;
    const insecureNetworkBadge = r.insecurePrivateNetwork === true ? '<span class="badge partial">Private network HTTP risk acknowledged</span>' : '';
    const enabled = r.enabled !== false;
    const injectionMode = r.injectionMode === 'session' ? 'session' : 'always';
    const diagnostic = r.diagnostic
      ? `<div class="rdiag">${esc(r.diagnostic.stageLabel || r.diagnostic.stage)} · ${esc(r.diagnostic.code)}: ${esc(r.diagnostic.message)}; Suggestion: ${esc(r.diagnostic.action)}${r.lastSuccessfulAt ? `; last success: ${esc(new Date(r.lastSuccessfulAt).toLocaleString('en-US', { hour12: false }))}` : ''}</div>`
      : '';
    return `<div class="row" data-key="${key}">
      <div class="info">
        <div class="rname">${esc(r.name)} ${authMode} ${healthBadge} ${scopeBadge} ${insecureNetworkBadge}</div>
        <div class="rmeta">${esc(r.serverName || '')} · ${esc(r.endpoint || r.url || '')}</div>
        ${diagnostic}
      </div>
      <select class="injection-select" aria-label="${esc(r.name)} tool injection mode" title="Session mode does not disconnect the connection; it only hides business tool schemas by default" onchange="window.__mcp.changeInjectionMode('${key}', this.value, this)">
        <option value="always" ${injectionMode === 'always' ? 'selected' : ''}>Always inject</option>
        <option value="session" ${injectionMode === 'session' ? 'selected' : ''}>Enable per session (experimental)</option>
      </select>
      <label class="switch" title="${enabled ? 'Disable' : 'Enable'}" aria-label="${enabled ? 'Disable' : 'Enable'} ${esc(r.name)}">
        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="window.__mcp.toggle('${key}', this.checked)">
        <span class="slider"></span>
      </label>
      ${canEditConfiguration ? `<button class="btn ghost" type="button" onclick="window.__mcp.openEditor('${key}')">Edit configuration</button>` : ''}
      ${canRename ? `<button class="btn ghost" type="button" onclick="window.__mcp.openRename('${key}')">Rename</button>` : ''}
      ${enabled ? `<button class="btn ghost" type="button" onclick="window.__mcp.showConnectionTools('${key}')">Tools</button>` : ''}
      <button class="btn ghost" type="button" onclick="window.__mcp.openScope('${key}')">Scope</button>
      <button class="btn danger" onclick="window.__mcp.disconnect('${key}')">Disconnect</button>
    </div>`;
  }

  function guidanceFor(message) {
    const text = String(message || 'Unknown error');
    const withAdvice = (advice) => `${text.replace(/[。！？.!?\s]+$/, '')}. ${advice}`;
    if (/CLI|OAuth|待授权|管理员|本地 MCP/i.test(text)) return text;
    if (/private-network HTTP requires explicit confirmation/i.test(text)) return withAdvice('If the target is a trusted private LAN IP, tick the plain-HTTP risk confirmation; do not enable it for public or untrusted services.');
    if (/protocol not allowed|only https/i.test(text)) return withAdvice('Public addresses must use HTTPS; HTTP is only allowed for loopback addresses, or explicitly confirmed private IP literals.');
    if (/JSON/i.test(text)) return withAdvice('Check the quotes and commas, and make sure the top level is mcpServers or connections.');
    if (/401|403|token|凭据|api.?key/i.test(text)) return withAdvice('Verify the auth method, that the Token/API key is still valid, and the header name.');
    if (/timeout|timed out|fetch|network|ECONN|ENOTFOUND/i.test(text)) return withAdvice('Check the network, that the endpoint is reachable, and that the MCP URL is complete.');
    return text;
  }

  function showModalError(message) {
    const node = $('#modal-error');
    if (!node) { showToast(guidanceFor(message), false); return; }
    node.textContent = guidanceFor(message);
    node.classList.add('show');
    node.focus?.();
  }

  function setModalBusy(busy, busyLabel = '') {
    const modal = $('#modal');
    if (!modal) return;
    modal.setAttribute('aria-busy', busy ? 'true' : 'false');
    const primary = modal.querySelector('.m-actions .btn:not(.ghost)');
    if (busy && primary) {
      primary.dataset.idleLabel = primary.textContent;
      primary.textContent = busyLabel || 'Working…';
    } else if (!busy && primary?.dataset.idleLabel) {
      primary.textContent = primary.dataset.idleLabel;
      delete primary.dataset.idleLabel;
    }
    modal.querySelectorAll('button, input, textarea, select').forEach((element) => { element.disabled = busy; });
  }

  function addTabs(active) {
    return `<div class="modal-tabs" role="tablist" aria-label="Ways to add a connection">
      <button type="button" class="${active === 'json' ? 'active' : ''}" onclick="window.__mcp.openAdd('json')">Import JSON</button>
      <button type="button" class="${active === 'manual' ? 'active' : ''}" onclick="window.__mcp.openAdd('manual')">Manual setup</button>
      <button type="button" class="${active === 'url' ? 'active' : ''}" onclick="window.__mcp.openAdd('url')">Market card</button>
    </div>`;
  }

  function openCatalogCredentialForm(preset) {
    const authMode = preset.authMode === 'api-key' ? 'api-key' : 'bearer';
    const servers = preset.servers || [];
    const usesStdio = servers.some((server) => server.transport === 'stdio');
    const homepage = /^https:\/\//i.test(preset.homepage || '') ? preset.homepage : '';
    const credentialName = preset.credentialName || (authMode === 'bearer' ? 'Bearer Token' : 'API Key');
    const credentialPlaceholder = preset.credentialPlaceholder || 'Stored only on this DSH machine';
    const credentialDescription = preset.credentialDescription || 'Credentials are stored only on this DSH machine; never written to the catalog or chat history.';
    const credentialHelpLabel = preset.credentialHelpLabel || `Get it from the ${preset.vendor || preset.name} website`;
    const declaredFields = preset.credentialFields?.length ? preset.credentialFields : [{
      key: 'credential', label: credentialName, placeholder: credentialPlaceholder,
      description: credentialDescription, required: true, secret: true,
    }];
    const stdioCredentialFields = declaredFields.map((field) => {
      const id = `cfg-credential-${field.key}`;
      return `<label for="${esc(id)}">${esc(field.label)}${field.required === false ? ' (optional)' : ' (required)'}</label><input id="${esc(id)}" data-credential-key="${esc(field.key)}" type="${field.secret === false ? 'text' : 'password'}" autocomplete="off" placeholder="${esc(field.placeholder || 'Stored only on this DSH machine')}" />${field.description ? `<div class="field-help">${esc(field.description)}</div>` : ''}`;
    }).join('');
    const credentialFields = usesStdio
      ? stdioCredentialFields
      : authMode === 'bearer'
        ? `<label for="cfg-token">${esc(credentialName)} (required)</label><input id="cfg-token" type="password" autocomplete="off" placeholder="${esc(credentialPlaceholder)}" /><div class="field-help">${esc(credentialDescription)}</div>`
        : `<div class="form-row"><div><label for="cfg-key-header">API Key Header</label><input id="cfg-key-header" value="${esc(preset.apiKeyHeader || 'X-Api-Key')}" /></div><div><label for="cfg-key-value">${esc(credentialName)} (required)</label><input id="cfg-key-value" type="password" autocomplete="off" placeholder="${esc(credentialPlaceholder)}" /></div></div><div class="field-help">${esc(credentialDescription)}</div>`;
    const serverPreview = servers.map((server) => {
      const modeLabel = server.transport === 'stdio' ? 'Local Agent · local files' : 'Remote Agent · online link documents';
      const endpoint = server.transport === 'stdio'
        ? `stdio · ${server.command || ''} ${(server.args || []).join(' ')}`.trim()
        : server.url;
      return `<div><strong>${esc(modeLabel)}</strong><br>${esc(server.serverName)} · ${esc(endpoint)}</div>`;
    }).join('');
    const mixedDocumentModes = usesStdio && servers.some((server) => server.transport !== 'stdio');
    openModal(`Configure ${preset.name}`, `
      <input id="cfg-connector-id" type="hidden" value="${esc(preset.id)}" />
      <input id="cfg-auth" type="hidden" value="${esc(authMode)}" />
      <div class="form-note"><strong>Configure ${servers.length} MCP servers at once</strong>These servers share the same ${esc(credentialName)}; credentials are stored only on this machine and never written to the catalog.</div>
      ${mixedDocumentModes ? '<div class="form-note"><strong>Online links and local files are enabled together</strong>The remote entry parses publicly reachable URLs; the local entry reads files uploaded, pasted, or referenced by path in the conversation and submits the parse automatically. Node.js 20+ is required.</div>' : ''}
      <div class="server-preview">${serverPreview}</div>
      ${scopeFieldHtml()}
      ${credentialFields}
      ${homepage ? `<div class="field-help"><a href="${esc(homepage)}" target="_blank" rel="noopener noreferrer">${esc(credentialHelpLabel)}</a></div>` : ''}
      <div class="inline-error" id="modal-error" tabindex="-1"></div>
      <div class="m-actions"><button class="btn ghost" type="button" onclick="window.__mcp.closeModal()">Cancel</button><button class="btn" type="button" onclick="window.__mcp.submitConfig()">Connect ${servers.length} servers</button></div>`);
  }

  function openConnectScope(connectorId) {
    const connector = marketItems[connectorId];
    if (!connector) return;
    openModal(`Connect ${connector.name}`, `
      <input id="scope-connector-id" type="hidden" value="${esc(connectorId)}" />
      <div class="form-note">${connectionLabels(connector).map(esc).join(' · ')}${connector.credentialDescription ? `<p>${esc(connector.credentialDescription)}</p>` : ''}${connectorId === 'dingtalk' ? '<p>Has your organization not opened CLI access, or can you not obtain authorization? You can cancel and wait for an administrator; there is no need to log in again or restart. One-click authorization cannot bypass company policy either. This version never starts a login on its own, and tool registration does not mean all business permissions have been granted.</p>' : ''}</div>
      <div class="form-note"><strong>Choose where the connection applies</strong>The connection configuration and credentials are still stored only once; project scope is enforced by the Host in tool visibility and execution.</div>
      ${scopeFieldHtml()}
      <div class="inline-error" id="modal-error" tabindex="-1"></div>
      <div class="m-actions"><button class="btn ghost" type="button" onclick="window.__mcp.closeModal()">Cancel</button><button class="btn" type="button" onclick="window.__mcp.confirmConnect()">Confirm connection</button></div>`);
  }

  function openScopeManager(key) {
    const item = installedItems.find((candidate) => candidate.key === key);
    if (!item) { showToast('The connection does not exist, please refresh and retry', false); return; }
    pendingScopeKey = key;
    openModal(`Connection scope · ${item.name}`, `
      <div class="form-note"><strong>Current: ${esc(item.scope?.label || 'Global')}</strong>Affected servers and known tools are previewed before the change; connection configuration, OAuth grants, and credentials are not copied.</div>
      <label for="scope-change-mode">Change mode</label><select id="scope-change-mode"><option value="move">Move (replace existing scope)</option><option value="copy">Copy (keep existing scope)</option></select>
      ${scopeFieldHtml({ id: 'scope-change-target' })}
      <div class="inline-error" id="modal-error" tabindex="-1"></div>
      <div class="m-actions"><button class="btn ghost" type="button" onclick="window.__mcp.closeModal()">Cancel</button><button class="btn" type="button" onclick="window.__mcp.submitScopeChange()">Preview and apply</button></div>`);
  }

  function openRenameConnection(key) {
    const item = installedItems.find((candidate) => candidate.key === key);
    if (!item) { showToast('The connection does not exist, please refresh and retry', false); return; }
    if (item.canRename !== true) {
      showToast('Market connector names are maintained by the catalog', false);
      return;
    }
    openModal('Rename connection', `
      <div class="form-note"><strong>Only changes the display name</strong>The current connection is not interrupted; <code>serverName</code>, the tool prefix, the scope, and credentials all stay unchanged.</div>
      <label for="rename-name">Connection display name (required)</label><input id="rename-name" value="${esc(item.name)}" maxlength="80" autocomplete="off" />
      <label for="rename-server-name">serverName (tool prefix, not editable)</label><input id="rename-server-name" value="${esc(item.serverName || '')}" disabled />
      <div class="inline-error" id="modal-error" tabindex="-1"></div>
      <div class="m-actions"><button class="btn ghost" type="button" onclick="window.__mcp.closeModal()">Cancel</button><button class="btn" type="button" onclick="window.__mcp.submitRename('${esc(key)}')">Save name</button></div>`);
  }

  async function openConnectionEditor(key) {
    const item = installedItems.find((candidate) => candidate.key === key);
    if (!item) { showToast('The connection does not exist, please refresh and retry', false); return; }
    const result = await call('editableConnectionConfig', { key });
    if (!result.ok) { showToast(result.message, false); return; }

  function renderResolvedPrompt(prompt, values) {
    const specs = Object.fromEntries(promptVariables(prompt).map((variable) => [variable.name, variable]));
    const missing = [];
    const text = String(prompt.text || prompt.title || '').replace(/\{\{\s*([A-Za-z][A-Za-z0-9_-]*)\s*\}\}|\{\s*([A-Za-z][A-Za-z0-9_-]*)\s*\}/g, (_token, a, b) => {
      const name = a || b;
      const spec = specs[name] || { name, label: name, required: true };
      const value = String(values[name] ?? spec.default ?? '').trim();
      if (!value && spec.required !== false) missing.push(spec.label || name);
      return value;
    });
    if (missing.length) throw new Error(`Please fill in: ${[...new Set(missing)].join(', ')}`);
    return text.replace(/\s+([，。！？；：])/g, '$1').replace(/[ \t]{2,}/g, ' ').trim();
  }

  function openPromptForm(prompt) {
    const variables = promptVariables(prompt);
    if (variables.length === 0) { window.__mcp.sendPrompt(prompt.text || prompt.title || ''); return; }
    if (!promptNeedsInput(prompt)) {
      window.__mcp.sendPrompt(renderResolvedPrompt(prompt, {}));
      return;
    }
    pendingPrompt = prompt;
    const fields = variables.map((variable) => `<label for="prompt-${esc(variable.name)}">${esc(variable.label)}${variable.required === false ? ' (optional)' : ' (required)'}</label><input id="prompt-${esc(variable.name)}" data-prompt-variable="${esc(variable.name)}" value="${esc(variable.default || '')}" placeholder="${esc(variable.placeholder || '')}" autocomplete="off" />${variable.description ? `<div class="field-help">${esc(variable.description)}</div>` : ''}`).join('');
    openModal(prompt.title || 'Fill in the query parameters', `<p class="field-help">Complete the parameters before sending. The content is only used for this new session and is not written back to the connector catalog.</p>${fields}<div class="inline-error" id="modal-error" tabindex="-1"></div><div class="m-actions"><button class="btn ghost" type="button" onclick="window.__mcp.closeModal()">Cancel</button><button class="btn" type="button" onclick="window.__mcp.submitPromptVariables()">Send in a new session</button></div>`);
  }

      const ids = (preview.detail.items || []).filter((item) => item.migratable && !item.alreadyMigrated).map((item) => item.id);
      if (!confirm(`Detected ${ids.length} migratable authorization group(s). Confirm copying them into MCP Connector? The original plugin and credentials are preserved.`)) return;
      const result = await call('migrateLegacy', { candidateIds: ids });
      showToast(result.message, result.ok);
      await loadInstalled();
    },
    async showConnectionTools(key) {
      const record = installedItems.find((item) => item.key === key);
      if (!record) return;
      await window.__mcp.showDetail(record.connectorId, {
        id: record.connectorId, connectionKey: key, name: record.name, icon: '🔌',
        authMode: record.authMode, connected: [record], connectionState: record.connectionState,
        description: 'Tool discovery and parameter details for the local connection; tools are not executed.',
      });
    },
    async showDetail(connectorId, connectionDescriptor) {
      const d = connectionDescriptor || marketItems[connectorId];
      if (!d) return;
      detailConnector = d;
      const incomplete = d.connected?.length > 0 && d.connectionComplete === false;
      detailFailureState = incomplete ? 'incomplete' : (d.connectionState || '');
      detailNeedsReconfigure = incomplete || ['reauth', 'recovering', 'unavailable'].includes(detailFailureState);
      const loadId = ++detailLoadId;
      $('#detail-icon').innerHTML = isImageIcon(d.icon)
        ? `<img src="${esc(d.icon)}" alt="" onerror="this.parentElement.innerHTML='🔌';" />`
        : `<span style="font-size:24px;">${esc(d.icon || '')}</span>`;
      $('#detail-name').textContent = d.name || '';
      const initialStateLabel = incomplete
        ? `${d.missingServers?.length || 1} server(s) still to complete`
        : (d.connectionLabel || (d.connected?.length ? 'Configured' : 'Not connected'));
      $('#detail-vendor').textContent = d.vendor ? `${d.vendor} · ${initialStateLabel} ${d.connected?.length || 0} server(s)` : `${initialStateLabel} ${d.connected?.length || 0} server(s)`;
      $('#detail-desc').textContent = d.description || d.summary || '';
      $('#detail-desc').textContent += '\n' + connectionLabels(d).join(' · ');
      detailPrompts = (d.prompts || []).filter((prompt) => prompt?.text || prompt?.title);
      promptPage = 0;
      renderPromptPage();
      detailToolServers = [];
      detailGovernance = null;
      toolRenderLimit = 50;
      $('#tools-search').value = '';
      $('#tools-disclosure').open = false;
      $('#tools-summary').textContent = t('loading');
      $('#detail-tools').innerHTML = '<div class="tools-loading">Reading available tools and descriptions…</div>';
      syncGovernanceBar();
      setDetailOpen(true);
      $('#detail-disconnect-btn').style.display = d.connected?.length > 0 ? 'block' : 'none';
      if (d.connectionKey) $('#detail-disconnect-btn').style.display = 'none';
      $('#detail-try-btn').style.display = d.connectionKey ? 'none' : '';
      const needsCredential = ['bearer', 'api-key'].includes(d.authMode);
      $('#detail-try-btn').textContent = detailNeedsReconfigure
        ? detailFailureState === 'incomplete' ? (d.authMode === 'oauth2-pkce' ? t('upgradeOauth') : t('completeSetup')) : d.authMode === 'oauth2-pkce' && detailFailureState === 'reauth' ? '🔐 Reauthorize' : needsCredential && detailFailureState === 'reauth' ? t('reconfigureCredential') : '🔄 Check again'
        : d.connected?.length > 0 ? t('try') : needsCredential ? t('configureConnect') : t('connectTry');
      if (!d.connected?.length && !d.toolsSnapshot?.length) {
        $('#tools-summary').textContent = t('connectToUse');
        $('#detail-tools').innerHTML = '<div class="tools-empty">After connecting, the server tool list can be read</div>';
        renderPromptPage();
        return;
      }
      const [toolsResult, governanceResult] = await Promise.all([
        call('toolsList', { connectorId, connectionKey: d.connectionKey, ...workspaceParams() }),
        call('governance', {}),
      ]);
      if (loadId !== detailLoadId || !$('#detail-overlay').classList.contains('active')) return;
      detailGovernance = governanceResult.ok ? governanceResult.detail : null;
      if (detailGovernance && toolsResult.detail?.governance) {
        Object.assign(detailGovernance, toolsResult.detail.governance);
      }
      syncGovernanceBar();
      if (!toolsResult.ok) {
        detailFailureState = toolsResult.detail?.connectionState || detailFailureState || 'unavailable';
        detailNeedsReconfigure = true;
        const diagnostic = toolsResult.detail?.diagnostic;
        $('#tools-summary').textContent = detailFailureState === 'unknown' ? 'Tool status unknown' : 'Failed to load tools';
        const failureHtml = `<div class="tools-error">${esc(toolsResult.message)}${diagnostic ? `<br><br>${esc(diagnostic.stageLabel || diagnostic.stage)} · ${esc(diagnostic.code)}: ${esc(diagnostic.message)}<br>Suggestion: ${esc(diagnostic.action)}${diagnostic.lastSuccessfulAt ? `<br>Last success: ${esc(new Date(diagnostic.lastSuccessfulAt).toLocaleString('en-US', { hour12: false }))}` : ''}` : ''}</div>`;
        detailToolServers = toolsResult.detail?.servers || [];
        if (detailToolServers.length > 0) {
          renderTools();
          $('#detail-tools').insertAdjacentHTML('afterbegin', failureHtml);
        } else {
          $('#detail-tools').innerHTML = failureHtml;
        }
        const failureLabel = detailFailureState === 'reauth'
          ? (d.authMode === 'oauth2-pkce' ? 'Authorization has expired' : 'Credentials have expired')
          : detailFailureState === 'unknown' ? 'Status not yet confirmed' : 'The current connection is abnormal';
        $('#detail-vendor').textContent = d.vendor ? `${d.vendor} · ${failureLabel}` : failureLabel;
        $('#detail-try-btn').textContent = d.authMode === 'oauth2-pkce' && detailFailureState === 'reauth'
          ? '🔐 Reauthorize'
          : needsCredential && detailFailureState === 'reauth' ? t('reconfigureCredential') : '🔄 Check again';
        renderPromptPage();
        return;
      }
      detailFailureState = incomplete ? 'incomplete' : (toolsResult.detail?.connectionState || 'healthy');
      detailNeedsReconfigure = incomplete;
      const connectedLabel = incomplete
        ? `${d.missingServers?.length || 1} server(s) still to complete`
        : `${detailFailureState === 'degraded' ? 'Partially available' : 'Connected'} ${d.connected?.length || 0} server(s)`;
      $('#detail-vendor').textContent = d.vendor ? `${d.vendor} · ${connectedLabel}` : connectedLabel;
      $('#detail-try-btn').textContent = incomplete ? (d.authMode === 'oauth2-pkce' ? t('upgradeOauth') : t('completeSetup')) : t('try');
      renderPromptPage();
      detailToolServers = toolsResult.detail?.servers || [];
      updateToolsSummary();
      renderTools();
    },
    submitPromptVariables() {
      if (!pendingPrompt) return;
      const values = {};
      $('#modal').querySelectorAll('[data-prompt-variable]').forEach((input) => { values[input.dataset.promptVariable] = input.value; });
      let prompt;
      try { prompt = renderResolvedPrompt(pendingPrompt, values); }
      catch (error) { showModalError(error.message); return; }
      pendingPrompt = null;
      closeModal();
      window.__mcp.sendPrompt(prompt);
    },
    sendPrompt(promptText) {
      const prompt = String(promptText || '').trim();
      if (!prompt) {
        showToast('The prompt cannot be empty', false);
        return;
      }
      if (promptRequestId !== null) return;
      if (window.parent === window) {
        showToast('Please use "Send to a new session" in DSH Desktop', false);
        return;
      }
      const requestId = `prompt-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      promptRequestId = requestId;
      setPromptLaunchPending(true);
      showToast('Creating a new session…', true);
      window.parent.postMessage({
        type: PROMPT_REQUEST_TYPE,
        requestId,
        prompt
      }, window.location.origin);
      promptRequestTimer = setTimeout(() => {
        finishPromptLaunch(requestId, false, 'Opening a new session timed out, please retry');
      }, 10000);
    },
    async disconnectCurrent() {
      const name = detailConnector?.name || $('#detail-name').textContent;
      if (!confirm(`Confirm disconnecting the connection for “${name}”? The OAuth authorization will be revoked.`)) return;
      // Find connection keys for this connector
      const r = await call('status', workspaceParams());
      if (r.ok) {
        const items = r.detail?.items ?? [];
        for (const item of items) {
          if (item.connectorId === detailConnector?.id) {
            const dr = await call('disconnect', { key: item.key });
            showToast(dr.message, dr.ok);
          }
        }
      }
      closeDetail();
      await refresh();
    },
  };

  $('#detail-close').addEventListener('click', closeDetail);
  $('#detail-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'detail-overlay') closeDetail();
  });
  $('#prompt-next').addEventListener('click', () => {
    promptPage += 1;
    renderPromptPage();
  });
  $('#detail-prompts').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-prompt-index]');
    if (!button) return;
    const prompt = detailPrompts[Number(button.dataset.promptIndex)];
    if (prompt && detailConnector?.connected?.length && !detailNeedsReconfigure) openPromptForm(prompt);
  });
  $('#tools-search').addEventListener('input', () => { toolRenderLimit = 50; renderTools(); });
  $('#connection-policy').addEventListener('change', (event) => applyPolicySelection(event.target));
  $('#policy-rollback').addEventListener('click', rollbackLatestPolicy);
  $('#detail-tools').addEventListener('change', (event) => {
    const select = event.target.closest('select[data-policy-scope]');
    if (select) applyPolicySelection(select);
  });
  $('#detail-tools').addEventListener('click', (event) => {
    const detailButton = event.target.closest('button[data-tool-detail]');
    if (detailButton) {
      openToolDetail(detailButton.dataset.serverName, detailButton.dataset.toolName);
      return;
    }
    if (event.target.closest('#tools-more')) {
      toolRenderLimit += 50;
      renderTools();
    }
  });
  $('#detail-try-btn').addEventListener('click', async () => {
    if (detailNeedsReconfigure) {
      if (detailFailureState === 'incomplete' && ['bearer', 'api-key'].includes(detailConnector?.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      if (detailFailureState === 'reauth' && ['bearer', 'api-key'].includes(detailConnector?.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      if (detailFailureState === 'incomplete' && detailConnector?.authMode === 'oauth2-pkce') {
        const id = detailConnector.id;
        const r = await call('connect', { connectorId: id }, { timeoutMs: 310_000 });
        showToast(r.message, r.ok);
        if (r.ok) {
          markCommunityCtaEligible();
          await call('healthCheck', { connectorId: id });
          await refreshConnectionUi(id);
        }
        return;
      }
      if (detailFailureState === 'reauth' && detailConnector?.authMode === 'oauth2-pkce') {
        const id = detailConnector.id;
        const r = await call('connect', { connectorId: id }, { timeoutMs: 310_000 });
        showToast(r.message, r.ok);
        if (r.ok) {
          markCommunityCtaEligible();
          await call('healthCheck', { connectorId: id });
          await refreshConnectionUi(id);
        }
        return;
      }
      const id = detailConnector?.id;
      if (id) await window.__mcp.showDetail(id);
      return;
    }
    if (!detailConnector?.connected?.length) {
      const id = detailConnector?.id;
      if (!id) return;
      if (['bearer', 'api-key'].includes(detailConnector.authMode)) {
        openAddConnection('manual', detailConnector);
        return;
      }
      openConnectScope(id);
      return;
    }
    const prompt = detailPrompts[promptPage * PROMPT_PAGE_SIZE];
    if (prompt) {
      openPromptForm(prompt);
    } else {
      showToast('No preset prompts yet', false);
    }
  });
  $('#detail-disconnect-btn').addEventListener('click', () => {
    window.__mcp.disconnectCurrent();
  });
  document.addEventListener('keydown', (e) => {
    if ($('#modalMask').classList.contains('show')) {
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
      if (e.key === 'Tab') {
        const focusable = [...$('#modal').querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled])')];
        if (!focusable.length) return;
        const first = focusable[0]; const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === 'Escape' && $('#detail-overlay').classList.contains('active')) closeDetail();
  });
  let statusEventSource = null;
  let statusRefreshTimer = null;
  let statusRefreshRunning = false;
  let statusRefreshPending = false;

  async function refreshOpenToolDetail() {
    if (!detailConnector || !$('#detail-overlay').classList.contains('active')) return;
    const id = detailLoadId;
    const result = await call('toolsList', { connectorId: detailConnector.id, connectionKey: detailConnector.connectionKey, ...workspaceParams(), cachedOnly: true });
    if (id !== detailLoadId || !$('#detail-overlay').classList.contains('active')) return;
    if (!result.detail?.servers) {
      detailToolServers = [];
      renderTools();
      $('#tools-summary').textContent = result.message || 'The connection is currently unavailable';
      return;
    }
    if (result.detail?.servers) {
      detailToolServers = result.detail.servers;
      renderTools();
      const pending = detailToolServers.some((server) => server.pending);
      const unknown = detailToolServers.some((server) => server.unknown);
      const available = detailToolServers.filter((server) => server.ok).length;
      const label = pending ? 'Discovering tools in the background' : unknown && available === 0 ? 'Tool status not yet confirmed'
        : available === detailToolServers.length ? 'Connected'
        : available > 0 ? 'Partially available' : 'The current connection is abnormal';
      detailFailureState = pending ? 'unknown' : available > 0 ? 'healthy' : 'unavailable';
      detailNeedsReconfigure = !pending && available === 0;
      $('#detail-vendor').textContent = detailConnector.vendor ? `${detailConnector.vendor} · ${label}` : label;
      $('#detail-try-btn').textContent = detailNeedsReconfigure ? '🔄 Check again' : t('try');
    }
  }

  function scheduleStatusRefresh() {
    if (document.hidden) return;
    statusRefreshPending = true;
    if (statusRefreshRunning) return;
    clearTimeout(statusRefreshTimer);
    statusRefreshTimer = setTimeout(async () => {
      statusRefreshRunning = true;
      statusRefreshPending = false;
      try {
        if (view === 'tools') await loadToolExplorer();
        else if (view === 'market') await loadMarket({ checkHealth: false, preserveScroll: true });
        else await loadInstalled();
        await refreshOpenToolDetail();
      } finally {
        statusRefreshRunning = false;
        if (statusRefreshPending) scheduleStatusRefresh();
      }
    }, 150);
  }

  function connectStatusEvents() {
    if (typeof EventSource !== 'function' || statusEventSource) return;
    const source = new EventSource('/mcp-connector/events');
    statusEventSource = source;
    source.addEventListener('ready', scheduleStatusRefresh);
    source.addEventListener('status', (event) => {
      try {
        const payload = JSON.parse(event.data);
        if (['connections', 'catalog', 'status', 'tools', 'governance', 'scope'].includes(payload.type)) scheduleStatusRefresh();
      } catch {}
    });
    source.addEventListener('error', () => {
      if (source.readyState === EventSource.CLOSED && statusEventSource === source) statusEventSource = null;
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      connectStatusEvents();
      scheduleStatusRefresh();
    }
  });
  window.addEventListener('pagehide', () => {
    notifyDetailState(false);
    clearTimeout(statusRefreshTimer);
    statusEventSource?.close();
    statusEventSource = null;
  });

  function refresh() { return view === 'tools' ? loadToolExplorer() : view === 'market' ? loadMarket() : loadInstalled(); }
  function syncTabs() {
    searchInput.placeholder = view === 'tools' ? 'Search tool names or descriptions…' : 'Search connectors…';
    $('#refresh').textContent = view === 'tools' ? 'Refresh the tools view' : 'Refresh the connector catalog';
    $('#refresh').title = $('#refresh').textContent;
    document.querySelectorAll('#tabs button').forEach((button) => button.classList.toggle('active', button.dataset.view === view));
    syncMarketNav();
  }

  $('#add-connection').addEventListener('click', () => openAddConnection('json'));
  $('#market-nav').addEventListener('click', (event) => {
    const categoryFilter = event.target.closest('[data-category-filter]');
    if (categoryFilter) {
      marketCategory = categoryFilter.dataset.categoryFilter || '';
      loadMarket({ checkHealth: false });
    }
  });
  main.addEventListener('click', (event) => {
    const sectionToggle = event.target.closest('[data-section-toggle]');
    if (sectionToggle) {
      const section = sectionToggle.dataset.sectionToggle;
      if (expandedMarketSections.has(section)) expandedMarketSections.delete(section);
      else expandedMarketSections.add(section);
      loadMarket({ checkHealth: false, preserveScroll: true });
    }
  });
  $('#refresh').addEventListener('click', async () => {
    if (view === 'tools') { await loadToolExplorer(); return; }
    const r = await call('refreshCatalog', {});
    showToast(r.message, r.ok);
    if (r.ok) {
      const health = await call('healthCheck', {});
      showToast(`${r.message}；${health.message}`, health.ok);
    }
    await refresh();
  });

  $('#tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    view = btn.dataset.view;
    explorerSequence++; explorerDetailSequence++;
    syncTabs();
    refresh();
  });

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    explorerSequence++; explorerOffset = 0;
    clearTimeout(searchTimer);
    if (view === 'tools') { searchTimer = setTimeout(() => { if (view === 'tools') void loadToolExplorer(); }, 200); return; }
    expandedMarketSections.clear();
    refresh();
  });

  requestWorkspaceContext();
  connectStatusEvents();
  refresh();
})();
</script>
</body>
</html>
